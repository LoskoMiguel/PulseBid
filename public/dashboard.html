<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subastas Disponibles</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 700px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .auction-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .auction-card img {
      width: 100%;
      border-radius: 10px;
    }

    .join-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #28a745;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .join-btn:hover {
      background: #1e7e34;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Subastas disponibles</h1>
    <div id="auctionsList">Cargando subastas...</div>
  </div>

  <script>
    async function loadAuctions() {
      const token = localStorage.getItem("token");

      const res = await fetch("http://127.0.0.1:3000/auctions/showAuctions", {
        headers: {
          "Authorization": `Bearer ${token}`
        }
      });

      const auctions = await res.json();
      const auctionsList = document.getElementById("auctionsList");
      auctionsList.innerHTML = "";

      auctions.forEach(a => {
        const card = document.createElement("div");
        card.className = "auction-card";

        card.innerHTML = `
          <img src="${a.product.image_url}" alt="Producto" />
          <h3>${a.product.name}</h3>
          <p>${a.product.description}</p>
          <p><strong>Precio inicial:</strong> $${a.start_price}</p>
          <button class="join-btn" onclick="joinAuction('${a.id}')">Unirse</button>
        `;

        auctionsList.appendChild(card);
      });
    }

    function joinAuction(id) {
      localStorage.setItem("auctionId", id);
      window.location.href = `/public/detail.html?id=${id}`;
    }

    loadAuctions();
  </script>

</body>
</html>
